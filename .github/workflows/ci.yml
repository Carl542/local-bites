name: Local Bites CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-build:
    name: Code Quality, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Safety Check (Rubric 3.1)
        run: npx tsc -b --noEmit

      - name: Lint Codebase
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build
